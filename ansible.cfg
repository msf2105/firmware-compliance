# Repo-root config — used by AWX / AAP (they run from the project root) and by
# CI. Local runs from workflow/ pick up workflow/ansible.cfg instead.
[defaults]
inventory            = workflow/inventory/hosts.yml
roles_path           = workflow/roles
host_key_checking    = False
retry_files_enabled  = False
stdout_callback      = default
result_format        = yaml
callbacks_enabled    = profile_tasks
gathering            = explicit
interpreter_python   = auto_silent
timeout              = 60
forks                = 10

[persistent_connection]
connect_timeout      = 60
command_timeout      = 120
