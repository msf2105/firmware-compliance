---
- name: Validate Secret Server auth selection
  hosts: localhost
  gather_facts: false
  vars:
    secret_id: 1234
    tss_base_url: "https://inventory.example.com/SecretServer"
    expected_base_url: "{{ lookup('env', 'TSS_BASE_URL') | default(tss_base_url, true) }}"
    expected_auth_value: >-
      {{ 'token:' ~ lookup('env', 'TSS_TOKEN')
         if (lookup('env', 'TSS_TOKEN') | length > 0)
         else 'user:' ~ lookup('env', 'TSS_USERNAME') ~ ':' ~ lookup('env', 'TSS_PASSWORD') }}

  tasks:
    - name: Resolve credentials through mocked Secret Server lookup
      ansible.builtin.include_role:
        name: secret_server

    - name: Assert effective URL and auth mode reached lookup plugin
      ansible.builtin.assert:
        that:
          - dev_username == expected_base_url
          - dev_password == expected_auth_value
          - dev_enable == expected_base_url ~ '/enable'
