---
- name: Seed completed firmware hosts
  hosts:
    - completed-ios
    - completed-nxos
  gather_facts: false
  tasks:
    - name: Mark selected hosts complete
      ansible.builtin.set_fact:
        firmware_workflow_completed: true

- name: Verify incomplete platform hosts fail the aggregate run
  hosts: localhost
  gather_facts: false
  tasks:
    - name: Aggregate firmware run status
      ansible.builtin.include_role:
        name: firmware_run_status

    - name: Assert incomplete platform host is detected
      ansible.builtin.assert:
        that:
          - firmware_target_hosts | sort == ['completed-ios', 'completed-nxos', 'incomplete-ios'] | sort
          - firmware_incomplete_hosts == ['incomplete-ios']
          - firmware_run_has_failures | bool
