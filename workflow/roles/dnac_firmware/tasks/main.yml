---
# dnac_firmware — Cisco Catalyst Center (DNA Center) SWIM compliance.
# Now with automatic latest-version determination via firmware_check.py.
- name: Build Catalyst Center connection params
  ansible.builtin.set_fact:
    _catc:
      dnac_host: "{{ ansible_host }}"
      dnac_username: "{{ dev_username }}"
      dnac_password: "{{ dev_password }}"
      dnac_verify: false
      dnac_debug: false
  no_log: true

- name: Get list of imported software images
  cisco.catalystcenter.swim_image_details_info:
    dnac_host: "{{ ansible_host }}"
    dnac_username: "{{ dev_username }}"
    dnac_password: "{{ dev_password }}"
    dnac_verify: false
    imageName: "{{ golden_versions.dnac.version }}"
  register: _catc_images
  ignore_errors: true
  no_log: true

- name: Determine Catalyst Center golden-image presence
  ansible.builtin.set_fact:
    target_version: "{{ golden_versions.dnac.version }}"
    running_version: "{{ (_catc_images.response | default([]) | length) | ternary('golden image imported', 'golden image MISSING') }}"
    compliant: "{{ (_catc_images.response | default([]) | length) > 0 }}"

- name: Evaluate version compliance (smart comparison via firmware_check.py)
  ansible.builtin.command:
    cmd: >-
      python3 {{ playbook_dir }}/../scripts/firmware_check.py
      --platform dnac --running "{{ running_version }}" --host "{{ inventory_hostname }}"
      --yaml {{ playbook_dir }}/../vars/golden_versions.yml
      {{ ('--product-id ' ~ golden_versions.dnac.cisco_pid) if golden_versions.dnac.cisco_pid is defined else '' }}
      --output ansible_facts
  delegate_to: localhost
  changed_when: false
  register: _dnac_check

- name: Parse compliance result
  ansible.builtin.set_fact:
    target_version: "{{ (_dnac_check.stdout | from_json)['firmware_check_' + inventory_hostname].effective_latest }}"
    compliant: "{{ (_dnac_check.stdout | from_json)['firmware_check_' + inventory_hostname].is_compliant }}"
    is_latest: "{{ (_dnac_check.stdout | from_json)['firmware_check_' + inventory_hostname].is_latest }}"
    version_status: "{{ (_dnac_check.stdout | from_json)['firmware_check_' + inventory_hostname].status_compliant }}"
    platform_label: "dnac"

- name: Report Catalyst Center status
  ansible.builtin.debug:
    msg: >
      CatalystCenter {{ inventory_hostname }} running={{ running_version }}
      latest={{ target_version }} compliant={{ compliant }} is_latest={{ is_latest }}
      status={{ version_status }}

- name: Import golden image + tag golden (guarded)
  when:
    - not (compliant | bool)
    - apply_cleared | bool
  block:
    - name: Import software image via URL
      cisco.catalystcenter.swim_image_url_import:
        dnac_host: "{{ ansible_host }}"
        dnac_username: "{{ dev_username }}"
        dnac_password: "{{ dev_password }}"
        dnac_verify: false
        payload:
          - sourceURL: "{{ golden_versions.dnac.image_url | default('') }}"
            thirdParty: false
      register: _catc_import
      when: (golden_versions.dnac.image_url | default('')) | length > 0
      no_log: true

    - name: Record upgrade action
      ansible.builtin.set_fact:
        upgrade_action: "Catalyst Center golden image {{ target_version }} import requested (distribute/activate scheduled per device)"
