---
# =====================================================================
# servicenow — ITSM change-record integration. Two entry points via the
# `snow_action` var:
#   open   -> create a Change Request, register snow_change_sys_id/number
#   note   -> add a work note (per-device compliance/upgrade result)
#   close  -> move the change to Review/Closed with an outcome
#
# SNOW auth via env: SNOW_INSTANCE, SNOW_USERNAME, SNOW_PASSWORD.
# =====================================================================

- name: Assert ServiceNow assignment group is configured
  when: snow_action in ['open', 'close']
  ansible.builtin.assert:
    that:
      - snow_assignment_group is defined
      - snow_assignment_group | string | length > 0
    fail_msg: >-
      ServiceNow change state transitions require an assignment group. Set
      snow_assignment_group or export SNOW_ASSIGNMENT_GROUP before apply mode.
  delegate_to: localhost
  run_once: true

- name: Open change request
  when: snow_action == 'open'
  block:
    - name: Create ServiceNow change request
      servicenow.itsm.change_request:
        instance:
          host: "{{ lookup('env', 'SNOW_INSTANCE') }}"
          username: "{{ lookup('env', 'SNOW_USERNAME') }}"
          password: "{{ lookup('env', 'SNOW_PASSWORD') }}"
        type: standard
        state: assess
        assignment_group: "{{ snow_assignment_group }}"
        short_description: "Automated firmware compliance run {{ ansible_date_time.iso8601 | default(lookup('pipe','date -Iseconds')) }}"
        description: >-
          Multi-platform firmware compliance / remediation initiated by Ansible.
          apply_updates={{ apply_updates }}. Targets: {{ groups['all'] | difference(['ungrouped']) | join(', ') }}.
      register: _snow_cr
      delegate_to: localhost
      run_once: true

    - name: Register change identifiers for downstream tasks
      ansible.builtin.set_fact:
        snow_change_sys_id: "{{ _snow_cr.record.sys_id }}"
        snow_change_number: "{{ _snow_cr.record.number }}"
      delegate_to: localhost
      run_once: true

- name: Add work note to change
  when: snow_action == 'note'
  servicenow.itsm.change_request:
    instance:
      host: "{{ lookup('env', 'SNOW_INSTANCE') }}"
      username: "{{ lookup('env', 'SNOW_USERNAME') }}"
      password: "{{ lookup('env', 'SNOW_PASSWORD') }}"
    sys_id: "{{ snow_change_sys_id }}"
    other:
      work_notes: "{{ snow_note }}"
  delegate_to: localhost

- name: Close change request
  when: snow_action == 'close'
  servicenow.itsm.change_request:
    instance:
      host: "{{ lookup('env', 'SNOW_INSTANCE') }}"
      username: "{{ lookup('env', 'SNOW_USERNAME') }}"
      password: "{{ lookup('env', 'SNOW_PASSWORD') }}"
    sys_id: "{{ snow_change_sys_id }}"
    state: closed
    assignment_group: "{{ snow_assignment_group }}"
    close_code: "{{ snow_close_code | default('successful') }}"
    close_notes: "{{ snow_close_notes | default('Firmware compliance run complete.') }}"
  delegate_to: localhost
  run_once: true
