---
# ios_firmware — Cisco IOS / IOS-XE version check + guarded upgrade.
# Now with automatic latest-version determination via firmware_check.py.
- name: Gather IOS facts
  cisco.ios.ios_facts:
    gather_subset: [hardware]
  vars:
    ansible_user: "{{ dev_username }}"
    ansible_password: "{{ dev_password }}"
    ansible_become: true
    ansible_become_method: enable
    ansible_become_password: "{{ dev_enable | default(dev_password) }}"
  register: _ios_facts

- name: Determine IOS running version
  ansible.builtin.set_fact:
    running_version: "{{ ansible_net_version | default(_ios_facts.ansible_facts.ansible_net_version) }}"

- name: Evaluate version compliance (smart comparison via firmware_check.py)
  ansible.builtin.command:
    cmd: >-
      python3 {{ playbook_dir }}/../scripts/firmware_check.py
      --platform ios --running "{{ running_version }}" --host "{{ inventory_hostname }}"
      --yaml {{ playbook_dir }}/../vars/golden_versions.yml
      {{ ('--product-id ' ~ golden_versions.ios.cisco_pid) if golden_versions.ios.cisco_pid is defined else '' }}
      --output ansible_facts
  delegate_to: localhost
  changed_when: false
  register: _ios_check

- name: Parse compliance result
  ansible.builtin.set_fact:
    target_version: "{{ (_ios_check.stdout | from_json)['firmware_check_' + inventory_hostname].effective_latest }}"
    compliant: "{{ (_ios_check.stdout | from_json)['firmware_check_' + inventory_hostname].is_compliant }}"
    is_latest: "{{ (_ios_check.stdout | from_json)['firmware_check_' + inventory_hostname].is_latest }}"
    version_status: "{{ (_ios_check.stdout | from_json)['firmware_check_' + inventory_hostname].status_compliant }}"
    platform_label: "ios"

- name: Report IOS status
  ansible.builtin.debug:
    msg: >
      IOS {{ inventory_hostname }} running={{ running_version }}
      latest={{ target_version }} compliant={{ compliant }} is_latest={{ is_latest }}
      status={{ version_status }}

- name: Upgrade IOS (guarded)
  when:
    - not (compliant | bool)
    - apply_cleared | bool
  vars:
    ansible_user: "{{ dev_username }}"
    ansible_password: "{{ dev_password }}"
    ansible_become: true
    ansible_become_method: enable
    ansible_become_password: "{{ dev_enable | default(dev_password) }}"
    _ios_target_image_path: "{{ golden_versions.ios.image_disk }}{{ golden_versions.ios.image_file }}"
  block:
    - name: Verify IOS golden image is present
      cisco.ios.ios_command:
        commands:
          - "dir {{ _ios_target_image_path }}"
      register: _ios_image_check
      changed_when: false

    - name: Fail when IOS golden image is missing
      ansible.builtin.assert:
        that:
          - _ios_image_check.stdout is defined
          - _ios_image_check.stdout | length > 0
          - golden_versions.ios.image_file in _ios_image_check.stdout[0]
          - _ios_image_check.stdout[0] is not search('(?i)(no such|error|not found|invalid)')
        fail_msg: "Refusing to change boot system: target IOS image {{ _ios_target_image_path }} is not present on {{ inventory_hostname }}."
        quiet: true

    - name: Backup running config before change
      cisco.ios.ios_config:
        backup: true
        backup_options:
          dir_path: "{{ playbook_dir }}/../backups/{{ inventory_hostname }}"
          filename: "pre-upgrade-{{ ansible_date_time.iso8601_basic_short | default('run') }}.cfg"

    - name: Set boot system to golden image
      cisco.ios.ios_config:
        lines:
          - "boot system {{ _ios_target_image_path }}"
        save_when: modified

    - name: Reload to activate (only when reboot_after_upgrade)
      cisco.ios.ios_command:
        commands:
          - command: "reload in 1 reason firmware upgrade {{ target_version }}"
            prompt: ['\[confirm\]', '\[yes/no\]']
            answer: ['y', 'yes']
      when: reboot_after_upgrade | bool

    - name: Record upgrade action
      ansible.builtin.set_fact:
        upgrade_action: "boot set to {{ target_version }}{{ ' + reload scheduled' if reboot_after_upgrade | bool else ' (reload deferred)' }}"
