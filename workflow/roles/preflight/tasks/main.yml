---
# =====================================================================
# preflight — the safety gate. Determines whether a host is CLEARED to
# apply firmware. An apply proceeds only if ALL are true:
#   * apply_updates == true            (explicit operator intent)
#   * inside the maintenance window     (time-boxed change)
#   * a change ticket exists (when require_change_ticket)
# Sets fact `apply_cleared` used by every platform role to guard the
# install/upgrade path. Check/audit always runs regardless.
# =====================================================================

- name: Reject direct apply clearance overrides
  ansible.builtin.assert:
    that:
      - apply_cleared is not defined
    fail_msg: >-
      apply_cleared is computed by the preflight role and must not be supplied
      directly. Use apply_updates=true inside an approved maintenance window
      with the required change ticket instead.

- name: Evaluate maintenance window
  ansible.builtin.set_fact:
    _now_hour: "{{ ('%H' | strftime(ansible_date_time.epoch | int)) | int if ansible_date_time is defined else (lookup('pipe','date +%H') | int) }}"
    _now_dow: "{{ (lookup('pipe','date +%u') | int) }}"   # 1=Mon .. 7=Sun
  run_once: true
  delegate_to: localhost

- name: Determine if we are inside the maintenance window (handles overnight wrap)
  ansible.builtin.set_fact:
    in_window: >-
      {{ (_now_dow | int) in maint_days and (
           (maint_start_hour <  maint_end_hour and (_now_hour | int) >= maint_start_hour and (_now_hour | int) < maint_end_hour)
           or
           (maint_start_hour >= maint_end_hour and ((_now_hour | int) >= maint_start_hour or (_now_hour | int) < maint_end_hour))
         ) }}
  run_once: true
  delegate_to: localhost

- name: Compute apply clearance
  ansible.builtin.set_fact:
    apply_cleared: >-
      {{ (apply_updates | bool)
         and (in_window | bool)
         and ((not (require_change_ticket | bool)) or (snow_change_number is defined and snow_change_number | length > 0)) }}
  delegate_to: localhost

- name: Announce mode
  ansible.builtin.debug:
    msg: >-
      MODE: {{ 'APPLY' if apply_cleared | bool else 'DRY-RUN (audit only)' }}
      | apply_updates={{ apply_updates }} in_window={{ in_window }}
      change_ticket={{ snow_change_number | default('none') }}
  run_once: true
