---
# preflight defaults — maintenance window definition. Overridable with -e.
maint_days: [6, 7]        # Saturday, Sunday (ISO: 1=Mon..7=Sun)
maint_start_hour: 22      # 22:00
maint_end_hour: 6         # ...through 06:00 on the following day for overnight
                          # windows. Adjust to your real change calendar.
