---
# preflight defaults — maintenance window definition. Overridable with -e.
maint_days: [6, 7]        # Saturday, Sunday (ISO: 1=Mon..7=Sun)
maint_start_hour: 22      # 22:00
maint_end_hour: 6         # 06:00. Overnight windows that wrap past midnight
                          # (start_hour >= end_hour, e.g. 22->6) ARE handled by
                          # the in_window logic in tasks/main.yml. Day check uses
                          # the CONTROLLER's local timezone (date +%u), not the
                          # target device's. Adjust to your real change calendar.

require_cab_approval: true   # 4th gate: normal (CAB-reviewed) SNOW changes must
                             # have approval=approved before apply proceeds.
                             # Overridable with -e require_cab_approval=false.
