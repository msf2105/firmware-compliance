---
# =====================================================================
# panos_firmware — Palo Alto PAN-OS audit + guarded, HA-aware upgrade.
#
# Audit (always):  system facts, HA state, device-local "software check"
#                  (latest available), version_check against golden.
# Upgrade (needs_upgrade AND apply_cleared):
#   - refuses the ACTIVE member of an HA pair (panos_allow_active_ha_upgrade)
#   - exports running config to backups/<host>/
#   - panos_software: downloads base image if needed, downloads + installs the
#     golden release; reboots only when reboot_after_upgrade=true
# Credentials never go in a URL — the API key is not generated by hand; the
# panos collection handles auth from the provider dict.
# =====================================================================

- name: Build PAN-OS provider
  ansible.builtin.set_fact:
    platform_label: panos
    _pan_provider:
      ip_address: "{{ ansible_host }}"
      username: "{{ dev_username }}"
      password: "{{ dev_password }}"
  no_log: true

- name: Live audit
  when: not (simulate | default(false) | bool)
  block:
    - name: Gather PAN-OS system facts
      paloaltonetworks.panos.panos_facts:
        provider: "{{ _pan_provider }}"
        gather_subset: [system]

    - name: Read HA state
      paloaltonetworks.panos.panos_op:
        provider: "{{ _pan_provider }}"
        cmd: show high-availability state
      register: _pan_ha
      changed_when: false
      failed_when: false

    - name: Ask the firewall which releases are available
      paloaltonetworks.panos.panos_op:
        provider: "{{ _pan_provider }}"
        cmd: request system software check
      register: _pan_check
      changed_when: false
      failed_when: false      # no internet / license on the mgmt plane -> fall back to golden

    - name: Record live facts
      ansible.builtin.set_fact:
        _pan_running: "{{ ansible_net_version }}"
        _pan_model: "{{ ansible_net_model | default('unknown') }}"
        _pan_ha_enabled: "{{ (_pan_ha_json.response.result.enabled | default('no')) == 'yes' }}"
        _pan_ha_state: "{{ _pan_ha_json.response.result.group['local-info'].state | default('standalone') }}"
        _pan_latest: >-
          {{ (_pan_entries | selectattr('latest', 'equalto', 'yes') | map(attribute='version') | first)
             | default('') }}
      vars:
        _pan_ha_json: "{{ (_pan_ha.stdout | default('{}')) | from_json }}"
        _pan_entries_raw: "{{ (((_pan_check.stdout | default('{}')) | from_json).response.result['sw-updates'].versions.entry) | default([]) }}"
        _pan_entries: "{{ [_pan_entries_raw] if _pan_entries_raw is mapping else _pan_entries_raw }}"

- name: Simulated facts
  when: simulate | default(false) | bool
  ansible.builtin.set_fact:
    _pan_running: "{{ simulated_running_version }}"
    _pan_model: "{{ simulated_model | default('PA-3220') }}"
    _pan_ha_enabled: "{{ simulated_ha_state is defined }}"
    _pan_ha_state: "{{ simulated_ha_state | default('standalone') }}"
    _pan_latest: "{{ simulated_latest_available | default('') }}"

- name: Evaluate compliance
  ansible.builtin.include_role:
    name: version_check
  vars:
    vc_platform: panos
    vc_running: "{{ _pan_running }}"
    vc_latest: "{{ _pan_latest }}"

- name: Report PAN-OS status
  ansible.builtin.debug:
    msg: >-
      PAN-OS {{ inventory_hostname }} model={{ _pan_model }} ha={{ _pan_ha_state }}
      running={{ running_version }} golden={{ target_version }} latest-available={{ latest_version }}
      status={{ version_status }}

- name: Hold the active HA member
  when:
    - needs_upgrade | bool
    - apply_cleared | bool
    - _pan_ha_enabled | bool
    - _pan_ha_state == 'active'
    - not (panos_allow_active_ha_upgrade | bool)
  ansible.builtin.set_fact:
    upgrade_action: "HELD: active HA member — upgrade the passive peer first, fail over, then re-run"
    _pan_hold: true

- name: Upgrade PAN-OS (guarded)
  when:
    - needs_upgrade | bool
    - apply_cleared | bool
    - not (_pan_hold | default(false))
  block:
    - name: Simulated upgrade plan
      when: (simulate | default(false) | bool) or (simulate_apply_only | default(false) | bool)
      ansible.builtin.set_fact:
        upgrade_action: >-
          SIMULATED: export config, download + install {{ target_version }}{{ ' + reboot' if reboot_after_upgrade | bool else ' (reboot deferred)' }}

    - name: Live upgrade
      when: not ((simulate | default(false) | bool) or (simulate_apply_only | default(false) | bool))
      block:
        - name: Create backup directory
          ansible.builtin.file:
            path: "{{ playbook_dir }}/../backups/{{ inventory_hostname }}"
            state: directory
            mode: "0750"
          delegate_to: localhost

        - name: Export running configuration
          paloaltonetworks.panos.panos_export:
            provider: "{{ _pan_provider }}"
            category: configuration
            filename: "{{ playbook_dir }}/../backups/{{ inventory_hostname }}/pre-upgrade-{{ lookup('pipe', 'date +%Y%m%dT%H%M%S') }}.xml"

        - name: Download + install golden PAN-OS
          paloaltonetworks.panos.panos_software:
            provider: "{{ _pan_provider }}"
            version: "{{ target_version }}"
            download: true
            install: true
            restart: "{{ reboot_after_upgrade | bool }}"
            sync_to_peer: false
            perform_software_check: true
            timeout: "{{ panos_software_timeout }}"
          register: _pan_sw

        - name: Record upgrade action
          ansible.builtin.set_fact:
            upgrade_action: >-
              panos_software {{ _pan_running }} -> {{ target_version }} downloaded+installed{{ ' + rebooted' if reboot_after_upgrade | bool else ' (reboot deferred)' }}
