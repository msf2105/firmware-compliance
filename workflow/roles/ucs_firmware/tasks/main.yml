---
# ucs_firmware — Cisco UCS Manager infrastructure bundle check.
# Now with automatic latest-version determination via firmware_check.py.
# Version comparison + firmware auto-install (guarded). UCS firmware upgrade
# is a multi-stage, service-impacting operation; this role AUDITS by default
# and only stages the infra bundle activation when cleared + reboot allowed.

- name: Query running UCS Manager version
  cisco.ucs.ucs_query:
    hostname: "{{ ansible_host }}"
    username: "{{ dev_username }}"
    password: "{{ dev_password }}"
    use_proxy: false
    class_ids: firmwareRunning
  register: _ucs_running
  ignore_errors: true
  no_log: true

- name: Determine UCS running version (best-effort parse)
  ansible.builtin.set_fact:
    running_version: "{{ (_ucs_running.objects | default([]) | selectattr('deployment','defined') | selectattr('deployment','equalto','system') | map(attribute='version') | list | first) | default('unknown') }}"

- name: Evaluate version compliance (smart comparison via firmware_check.py)
  ansible.builtin.command:
    cmd: >-
      python3 {{ playbook_dir }}/../scripts/firmware_check.py
      --platform ucs --running "{{ running_version }}" --host "{{ inventory_hostname }}"
      --yaml {{ playbook_dir }}/../vars/golden_versions.yml
      {{ ('--product-id ' ~ golden_versions.ucs.cisco_pid) if golden_versions.ucs.cisco_pid is defined else '' }}
      --output ansible_facts --exit-zero
  delegate_to: localhost
  changed_when: false
  register: _ucs_check

- name: Parse compliance result
  ansible.builtin.set_fact:
    target_version: "{{ (_ucs_check.stdout | from_json)['firmware_check_' + inventory_hostname].effective_latest }}"
    compliant: "{{ (_ucs_check.stdout | from_json)['firmware_check_' + inventory_hostname].is_compliant }}"
    is_latest: "{{ (_ucs_check.stdout | from_json)['firmware_check_' + inventory_hostname].is_latest }}"
    version_status: "{{ (_ucs_check.stdout | from_json)['firmware_check_' + inventory_hostname].status_compliant }}"
    platform_label: "ucs"

- name: Report UCS status
  ansible.builtin.debug:
    msg: >
      UCSM {{ inventory_hostname }} running={{ running_version }}
      latest={{ target_version }} compliant={{ compliant }} is_latest={{ is_latest }}
      status={{ version_status }}

- name: Stage UCS infra firmware (guarded)
  when:
    - not (compliant | bool)
    - apply_cleared | bool
    - reboot_after_upgrade | bool     # UCS activation is service-impacting
  block:
    - name: Set auto-install infrastructure firmware to golden bundle
      cisco.ucs.ucs_managed_objects:
        hostname: "{{ ansible_host }}"
        username: "{{ dev_username }}"
        password: "{{ dev_password }}"
        use_proxy: false
        objects:
          - module: ucsmsdk.mometa.firmware.FirmwareInfraPack
            class: FirmwareInfraPack
            properties:
              parent_mo_or_dn: "org-root"
              name: "default"
              infra_bundle_version: "{{ golden_versions.ucs.version }}"
      register: _ucs_fw
      no_log: true

    - name: Record upgrade action
      ansible.builtin.set_fact:
        upgrade_action: "UCS infra pack set to {{ target_version }} (auto-install triggered)"
