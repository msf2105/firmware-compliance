---
# nxos_firmware — Cisco NX-OS version check + guarded upgrade.
# Now with automatic latest-version determination via firmware_check.py.
- name: Gather NX-OS facts
  cisco.nxos.nxos_facts:
    gather_subset: [hardware]
  vars:
    ansible_user: "{{ dev_username }}"
    ansible_password: "{{ dev_password }}"
  register: _nx_facts

- name: Determine NX-OS running version
  ansible.builtin.set_fact:
    running_version: "{{ ansible_net_version | default(_nx_facts.ansible_facts.ansible_net_version) }}"

- name: Evaluate version compliance (smart comparison via firmware_check.py)
  ansible.builtin.command:
    cmd: >-
      python3 {{ playbook_dir }}/../scripts/firmware_check.py
      --platform nxos --running "{{ running_version }}" --host "{{ inventory_hostname }}"
      --yaml {{ playbook_dir }}/../vars/golden_versions.yml
      {{ ('--product-id ' ~ golden_versions.nxos.cisco_pid) if golden_versions.nxos.cisco_pid is defined else '' }}
      --output ansible_facts --exit-zero
  delegate_to: localhost
  changed_when: false
  register: _nx_check

- name: Parse compliance result
  ansible.builtin.set_fact:
    target_version: "{{ (_nx_check.stdout | from_json)['firmware_check_' + inventory_hostname].effective_latest }}"
    compliant: "{{ (_nx_check.stdout | from_json)['firmware_check_' + inventory_hostname].is_compliant }}"
    is_latest: "{{ (_nx_check.stdout | from_json)['firmware_check_' + inventory_hostname].is_latest }}"
    version_status: "{{ (_nx_check.stdout | from_json)['firmware_check_' + inventory_hostname].status_compliant }}"
    platform_label: "nxos"

- name: Report NX-OS status
  ansible.builtin.debug:
    msg: >
      NX-OS {{ inventory_hostname }} running={{ running_version }}
      latest={{ target_version }} compliant={{ compliant }} is_latest={{ is_latest }}
      status={{ version_status }}

- name: Upgrade NX-OS (guarded)
  when:
    - not (compliant | bool)
    - apply_cleared | bool
  vars:
    ansible_user: "{{ dev_username }}"
    ansible_password: "{{ dev_password }}"
  block:
    - name: Backup running config before change
      cisco.nxos.nxos_config:
        backup: true
        backup_options:
          dir_path: "{{ playbook_dir }}/../backups/{{ inventory_hostname }}"
          filename: "pre-upgrade-{{ ansible_date_time.iso8601_basic_short | default('run') }}.cfg"

    # nxos_install_os handles copy + install-all + reload orchestration.
    - name: Install NX-OS golden image
      cisco.nxos.nxos_install_os:
        system_image_file: "{{ golden_versions.nxos.image_file }}"
      register: _nx_install
      when: reboot_after_upgrade | bool

    - name: Record upgrade action
      ansible.builtin.set_fact:
        upgrade_action: "nxos_install_os -> {{ target_version }}{{ '' if reboot_after_upgrade | bool else ' (install deferred: reboot_after_upgrade=false)' }}"
