---
# asa_firmware — Cisco ASA version check + guarded boot-image change.
# Now with automatic latest-version determination via firmware_check.py.
- name: Gather ASA facts
  cisco.asa.asa_facts:
    gather_subset: [hardware]
  vars:
    ansible_user: "{{ dev_username }}"
    ansible_password: "{{ dev_password }}"
    ansible_become: true
    ansible_become_method: enable
    ansible_become_password: "{{ dev_enable | default(dev_password) }}"
  register: _asa_facts

- name: Determine ASA running version
  ansible.builtin.set_fact:
    running_version: "{{ ansible_net_version | default(_asa_facts.ansible_facts.ansible_net_version) }}"

- name: Evaluate version compliance (smart comparison via firmware_check.py)
  ansible.builtin.command:
    cmd: >-
      python3 {{ playbook_dir }}/../scripts/firmware_check.py
      --platform asa --running "{{ running_version }}" --host "{{ inventory_hostname }}"
      --yaml {{ playbook_dir }}/../vars/golden_versions.yml
      {{ ('--product-id ' ~ golden_versions.asa.cisco_pid) if golden_versions.asa.cisco_pid is defined else '' }}
      --output ansible_facts
  delegate_to: localhost
  changed_when: false
  register: _asa_check

- name: Parse compliance result
  ansible.builtin.set_fact:
    target_version: "{{ (_asa_check.stdout | from_json)['firmware_check_' + inventory_hostname].effective_latest }}"
    compliant: "{{ (_asa_check.stdout | from_json)['firmware_check_' + inventory_hostname].is_compliant }}"
    is_latest: "{{ (_asa_check.stdout | from_json)['firmware_check_' + inventory_hostname].is_latest }}"
    version_status: "{{ (_asa_check.stdout | from_json)['firmware_check_' + inventory_hostname].status_compliant }}"
    platform_label: "asa"

- name: Report ASA status
  ansible.builtin.debug:
    msg: >
      ASA {{ inventory_hostname }} running={{ running_version }}
      latest={{ target_version }} compliant={{ compliant }} is_latest={{ is_latest }}
      status={{ version_status }}

- name: Upgrade ASA (guarded)
  when:
    - not (compliant | bool)
    - apply_cleared | bool
  vars:
    ansible_user: "{{ dev_username }}"
    ansible_password: "{{ dev_password }}"
    ansible_become: true
    ansible_become_method: enable
    ansible_become_password: "{{ dev_enable | default(dev_password) }}"
  block:
    - name: Stamp this ASA backup
      ansible.builtin.set_fact:
        _backup_timestamp: "{{ lookup('pipe', 'date -u +%Y%m%dT%H%M%S%NZ') }}"

    - name: Backup running config before change
      cisco.asa.asa_config:
        backup: true
        backup_options:
          dir_path: "{{ playbook_dir }}/../backups/{{ inventory_hostname }}"
          filename: "pre-upgrade-{{ _backup_timestamp }}.cfg"

    - name: Set boot image to golden
      cisco.asa.asa_config:
        lines:
          - "boot system {{ golden_versions.asa.image_disk }}/{{ golden_versions.asa.image_file }}"
        save_when: modified

    - name: Reload to activate (only when reboot_after_upgrade)
      cisco.asa.asa_command:
        commands:
          - command: "reload noconfirm"
      when: reboot_after_upgrade | bool

    - name: Record upgrade action
      ansible.builtin.set_fact:
        upgrade_action: "boot set to {{ target_version }}{{ ' + reload' if reboot_after_upgrade | bool else ' (reload deferred)' }}"
