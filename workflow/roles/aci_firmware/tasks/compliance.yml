---
- name: Determine ACI controller firmware versions
  ansible.builtin.set_fact:
    _aci_controller_versions: "{{ _aci_running.imdata | default([]) | map(attribute='firmwareCtrlrRunning.attributes.version') | select('defined') | list }}"
    target_version: "{{ golden_versions.aci.apic_version }}"

- name: Compute ACI compliance flag
  ansible.builtin.set_fact:
    running_version: "{{ (_aci_controller_versions | length > 0) | ternary(_aci_controller_versions | join(', '), 'unknown') }}"
    compliant: "{{ (_aci_controller_versions | length > 0) and ((_aci_controller_versions | difference([target_version])) | length == 0) }}"
