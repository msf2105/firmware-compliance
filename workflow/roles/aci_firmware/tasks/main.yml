---
# aci_firmware — Cisco ACI (APIC) controller + switch firmware compliance.
# Now with automatic latest-version determination via firmware_check.py.
- name: Build APIC connection params
  ansible.builtin.set_fact:
    _aci_conn:
      host: "{{ ansible_host }}"
      username: "{{ dev_username }}"
      password: "{{ dev_password }}"
      use_proxy: false
      validate_certs: false
  no_log: true

- name: Query APIC controller firmware (running)
  cisco.aci.aci_rest:
    host: "{{ ansible_host }}"
    username: "{{ dev_username }}"
    password: "{{ dev_password }}"
    validate_certs: false
    use_proxy: false
    method: get
    path: /api/node/class/firmwareCtrlrRunning.json
  register: _aci_running
  no_log: true

- name: Determine ACI running version
  ansible.builtin.set_fact:
    running_version: "{{ (_aci_running.imdata | default([]) | map(attribute='firmwareCtrlrRunning.attributes.version') | list | first) | default('unknown') }}"

- name: Evaluate version compliance (smart comparison via firmware_check.py)
  ansible.builtin.command:
    cmd: >-
      python3 {{ playbook_dir }}/../scripts/firmware_check.py
      --platform aci --running "{{ running_version }}" --host "{{ inventory_hostname }}"
      --yaml {{ playbook_dir }}/../vars/golden_versions.yml
      {{ ('--product-id ' ~ golden_versions.aci.cisco_pid) if golden_versions.aci.cisco_pid is defined else '' }}
      --output ansible_facts
  delegate_to: localhost
  changed_when: false
  register: _aci_check

- name: Parse compliance result
  ansible.builtin.set_fact:
    target_version: "{{ (_aci_check.stdout | from_json)['firmware_check_' + inventory_hostname].effective_latest }}"
    compliant: "{{ (_aci_check.stdout | from_json)['firmware_check_' + inventory_hostname].is_compliant }}"
    is_latest: "{{ (_aci_check.stdout | from_json)['firmware_check_' + inventory_hostname].is_latest }}"
    version_status: "{{ (_aci_check.stdout | from_json)['firmware_check_' + inventory_hostname].status_compliant }}"
    platform_label: "aci"

- name: Report ACI status
  ansible.builtin.debug:
    msg: >
      APIC {{ inventory_hostname }} running={{ running_version }}
      latest={{ target_version }} compliant={{ compliant }} is_latest={{ is_latest }}
      status={{ version_status }}

- name: Set ACI controller firmware policy (guarded)
  when:
    - not (compliant | bool)
    - apply_cleared | bool
  block:
    - name: Point controller firmware policy at golden version
      cisco.aci.aci_firmware_policy:
        host: "{{ ansible_host }}"
        username: "{{ dev_username }}"
        password: "{{ dev_password }}"
        validate_certs: false
        use_proxy: false
        name: "compliance-golden"
        version: "{{ golden_versions.aci.switch_version }}"
        ignore_compat: false
      register: _aci_fw
      no_log: true

    - name: Record upgrade action
      ansible.builtin.set_fact:
        upgrade_action: "ACI firmware policy set to switch {{ golden_versions.aci.switch_version }} / apic {{ target_version }} (scheduler activates)"
