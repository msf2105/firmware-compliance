[defaults]
inventory            = inventory/hosts.yml
roles_path           = roles
host_key_checking    = False
retry_files_enabled  = False
stdout_callback      = default
result_format        = yaml
callbacks_enabled    = profile_tasks
gathering            = explicit
interpreter_python   = auto_silent
timeout              = 60
forks                = 10

[persistent_connection]
# nxos_install_os exits unless both persistent timers are at least 600s.
connect_timeout      = 600
command_timeout      = 600
