# =====================================================================
# LAB inventory — real EVE-NG devices on the lab management network,
# reached from AWX over the Tailscale subnet route (192.168.122.0/24).
#
#   credentials : Bitwarden Secrets Manager (project "firmware-compliance",
#                 EU server). BWS_ACCESS_TOKEN/BWS_SERVER_URL are injected by the
#                 AWX credential "Bitwarden Secrets Manager - dev"; each host's
#                 bws_secret_id points at a secret whose VALUE is JSON:
#                   {"username": "netauto", "password": "...", "enable": "..."}
#                 Break-glass: -e credential_source=vault with
#                 vault_device_credentials.default (no secrets in git).
#   golden      : ios_golden_override pins the lab golden to the vIOS
#                 release so R1 audits OK and SW1 (older vios_l2) shows DRIFT.
#   ServiceNow  : not needed for audit; apply stays simulated in the lab.
#
#   ansible-playbook playbooks/site.yml -i inventory/lab.yml
# =====================================================================
all:
  vars:
    credential_source: "{{ lookup('env', 'CREDENTIAL_SOURCE') | default('bitwarden_sm', true) }}"
    simulate_apply_only: true
    # Lab window: always open so the apply path can be rehearsed any time.
    maint_days: [1, 2, 3, 4, 5, 6, 7]
    maint_start_hour: 0
    maint_end_hour: 0

  children:
    ios:
      hosts:
        lab-r1:        { ansible_host: 192.168.122.51, bws_secret_id: "5917d7bf-4a0f-4706-8c43-b4f600fded4a", site: lab,        role: router }   # EVE-NG node R1  (vIOS 15.9(3)M10)
        lab-sw1:       { ansible_host: 192.168.122.52, bws_secret_id: "5917d7bf-4a0f-4706-8c43-b4f600fded4a", site: lab,        role: switch }   # EVE-NG node SW1 (vIOS-L2 15.2 experimental)
        # "Enterprise" build-out (2026-11-05): Dallas HQ + Richardson branch. All share the lab netauto secret.
        dal-wan-rtr01: { ansible_host: 192.168.122.61, bws_secret_id: "5917d7bf-4a0f-4706-8c43-b4f600fded4a", site: dallas,     role: wan-edge }   # vIOS 15.9(3)M10  -> OK
        # dal-wan-rtr02: { ansible_host: 192.168.122.62, bws_secret_id: "5917d7bf-4a0f-4706-8c43-b4f600fded4a", site: dallas,     role: wan-edge }   # vIOS (stopped — unlicensed EVE: 7-node cap)
        dal-core-sw01: { ansible_host: 192.168.122.71, bws_secret_id: "5917d7bf-4a0f-4706-8c43-b4f600fded4a", site: dallas,     role: core }       # vIOS-L2         -> DRIFT
        dal-core-sw02: { ansible_host: 192.168.122.72, bws_secret_id: "5917d7bf-4a0f-4706-8c43-b4f600fded4a", site: dallas,     role: core }       # vIOS-L2         -> DRIFT
        rich-acc-sw01: { ansible_host: 192.168.122.81, bws_secret_id: "5917d7bf-4a0f-4706-8c43-b4f600fded4a", site: richardson, role: access }     # vIOS-L2         -> DRIFT
        # rich-acc-sw02: { ansible_host: 192.168.122.82, bws_secret_id: "5917d7bf-4a0f-4706-8c43-b4f600fded4a", site: richardson, role: access }     # vIOS-L2 (stopped — 7-node cap)
      vars:
        ansible_network_os: cisco.ios.ios
        ansible_connection: ansible.netcommon.network_cli
        # vIOS 15.x only offers SHA1 kex (dh-group14-sha1) and ssh-rsa host keys;
        # paramiko>=4 dropped SHA1 kex; the EE (>=1.1) pins paramiko 3.x and uses it here.
        ansible_network_cli_ssh_type: paramiko
        ios_golden_override:
          version: "15.9(3)M10"
          image_file: "vios-adventerprisek9-m.SPA.159-3.M10"
          image_disk: "flash0:"
          image_server: "http://192.168.122.1/images"
          image_md5: ""
          cisco_pid: "IOSV"

    asa:
      hosts:
        dal-fw01a: { ansible_host: 192.168.122.91, bws_secret_id: "5917d7bf-4a0f-4706-8c43-b4f600fded4a", site: dallas, role: firewall }   # ASAv 9.23(1)3
      vars:
        ansible_network_os: cisco.asa.asa
        ansible_connection: ansible.netcommon.network_cli
        ansible_network_cli_ssh_type: paramiko     # ASAv offers ssh-rsa host keys only
        ansible_become: true
        ansible_become_method: enable

