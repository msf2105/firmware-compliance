# =====================================================================
# LAB inventory — real EVE-NG devices on the lab management network,
# reached from AWX over the Tailscale subnet route (192.168.122.0/24).
#
#   credentials : Bitwarden Secrets Manager (project "firmware-compliance",
#                 EU server). BWS_ACCESS_TOKEN/BWS_SERVER_URL are injected by the
#                 AWX credential "Bitwarden Secrets Manager - dev"; each host's
#                 bws_secret_id points at a secret whose VALUE is JSON:
#                   {"username": "netauto", "password": "...", "enable": "..."}
#                 Break-glass: -e credential_source=vault with
#                 vault_device_credentials.default (no secrets in git).
#   golden      : ios_golden_override pins the lab golden to the vIOS
#                 release so R1 audits OK and SW1 (older vios_l2) shows DRIFT.
#   ServiceNow  : not needed for audit; apply stays simulated in the lab.
#
#   ansible-playbook playbooks/site.yml -i inventory/lab.yml
# =====================================================================
all:
  vars:
    credential_source: "{{ lookup('env', 'CREDENTIAL_SOURCE') | default('bitwarden_sm', true) }}"
    simulate_apply_only: true
    # Lab window: always open so the apply path can be rehearsed any time.
    maint_days: [1, 2, 3, 4, 5, 6, 7]
    maint_start_hour: 0
    maint_end_hour: 0

  children:
    ios:
      hosts:
        lab-r1:  { ansible_host: 192.168.122.51, bws_secret_id: "5917d7bf-4a0f-4706-8c43-b4f600fded4a" }   # EVE-NG node R1  (vIOS 15.9(3)M10)
        lab-sw1: { ansible_host: 192.168.122.52, bws_secret_id: "5917d7bf-4a0f-4706-8c43-b4f600fded4a" }   # EVE-NG node SW1 (vIOS-L2 15.2 experimental)
      vars:
        ansible_network_os: cisco.ios.ios
        ansible_connection: ansible.netcommon.network_cli
        # vIOS 15.x only offers SHA1 kex (dh-group14-sha1) and ssh-rsa host keys;
        # paramiko>=4 dropped SHA1 kex; the EE (>=1.1) pins paramiko 3.x and uses it here.
        ansible_network_cli_ssh_type: paramiko
        ios_golden_override:
          version: "15.9(3)M10"
          image_file: "vios-adventerprisek9-m.SPA.159-3.M10"
          image_disk: "flash0:"
          image_server: "http://192.168.122.1/images"
          image_md5: ""
          cisco_pid: "IOSV"
