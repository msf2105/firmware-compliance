---
# =====================================================================
# PRODUCTION inventory template (credential_source: secret_server).
#   inventory/dev.yml   -> EVE-NG lab + Bitwarden (dev)
#   inventory/demo.yml  -> fully simulated, runs anywhere (demo rehearsal)
#
# Inventory — one group per platform. Hosts here carry NO credentials;
# creds are resolved at run time from Delinea Secret Server using the
# `secret_id` on each host (see roles/secret_server). ansible_host is the
# management IP/FQDN. Replace the sample hosts with your real devices.
# =====================================================================
all:
  vars:
    # Secret Server connection (base URL + how to auth) — the secret VALUES
    # come from Delinea at run time, never stored here.
    tss_base_url: "https://secretserver.example.com/SecretServer"
    credential_source: secret_server

  children:
    ios:
      # IOS-XE devices NOT managed by Catalyst Center (those go through SWIM)
      hosts:
        core-sw01: { ansible_host: 10.20.0.11, secret_id: 1001 }
      vars:
        ansible_network_os: cisco.ios.ios
        ansible_connection: ansible.netcommon.network_cli

    iosxr:
      hosts:
        edge-rtr01: { ansible_host: 10.20.0.21, secret_id: 1002 }
      vars:
        ansible_network_os: cisco.iosxr.iosxr
        ansible_connection: ansible.netcommon.network_cli

    nxos:
      hosts:
        dc-leaf01: { ansible_host: 10.20.0.31, secret_id: 1003 }
      vars:
        ansible_network_os: cisco.nxos.nxos
        ansible_connection: ansible.netcommon.network_cli

    asa:
      hosts:
        fw-asa01: { ansible_host: 10.20.0.41, secret_id: 1004 }
      vars:
        ansible_network_os: cisco.asa.asa
        ansible_connection: ansible.netcommon.network_cli

    aci:
      # APIC controllers — HTTP API, not SSH
      hosts:
        apic01: { ansible_host: 10.20.0.51, secret_id: 1005 }
      vars:
        ansible_connection: local

    dnac:
      # Catalyst Center cluster — HTTP API. Upgrades the devices IT manages (SWIM).
      hosts:
        catc01: { ansible_host: 10.20.0.61, secret_id: 1006 }
      vars:
        ansible_connection: local

    sdwan:
      # Catalyst SD-WAN Manager (vManage) — HTTP API. Upgrades WAN edges.
      hosts:
        sdwan-mgr01: { ansible_host: 10.20.0.65, secret_id: 1011 }
      vars:
        ansible_connection: local

    ise:
      hosts:
        ise-ppan01: { ansible_host: 10.20.0.71, secret_id: 1007 }
      vars:
        ansible_connection: local

    ucs:
      # UCS Manager — HTTP API
      hosts:
        ucsm01: { ansible_host: 10.20.0.81, secret_id: 1008 }
      vars:
        ansible_connection: local

    panos:
      # Palo Alto firewall/Panorama — HTTP API
      hosts:
        pa-fw01: { ansible_host: 10.20.0.91, secret_id: 1009 }
      vars:
        ansible_connection: local

    f5:
      # BIG-IP — iControl REST
      hosts:
        bigip01: { ansible_host: 10.20.0.101, secret_id: 1010 }
      vars:
        ansible_connection: local
