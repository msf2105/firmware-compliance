---
# =====================================================================
# site.yml — multi-platform firmware compliance orchestrator.
#
#   Play 1 (localhost)  apply mode only: open a NORMAL ServiceNow change for
#                       CAB review, or read the approval on an existing one.
#   Play 2 (devices)    per host: credentials (Secret Server / Bitwarden /
#                       vault) -> preflight gate -> platform role. Roles always
#                       AUDIT and only change a device when apply_cleared.
#                       A failing host is caught and reported, never silently
#                       dropped.
#   Play 3 (localhost)  compliance report (JSON + HTML), attach to the change,
#                       close it (or leave a note when nothing was applied).
#
# SAFETY: audit is the default. A firmware push needs ALL of:
#   -e apply_updates=true, inside the maintenance window, a change number,
#   and CAB approval=approved on that change. Miss any one -> audit only.
#
#   Audit (default):     ansible-playbook playbooks/site.yml
#   Open change (run 1): ansible-playbook playbooks/site.yml -e apply_updates=true
#   Apply (run 2):       ansible-playbook playbooks/site.yml -e apply_updates=true -e snow_change_number=CHGxxxxxxx
# =====================================================================

# ---------- Play 1: open or verify the change record (apply mode) ----------
- name: Open or verify ServiceNow change (apply mode)
  hosts: localhost
  gather_facts: false
  vars_files:
    - ../vars/golden_versions.yml
  tasks:
    - name: Check CAB approval on the existing change (run 2)
      when:
        - apply_updates | bool
        - require_change_ticket | bool
        - snow_change_number | default('') | length > 0
      ansible.builtin.include_role:
        name: servicenow
      vars:
        snow_action: check_approval

    - name: Open a new normal change for CAB review (run 1)
      when:
        - apply_updates | bool
        - require_change_ticket | bool
        - snow_change_number | default('') | length == 0
      ansible.builtin.include_role:
        name: servicenow
      vars:
        snow_action: open
        snow_short_description: "{{ ('Firmware compliance remediation — ' ~ _scope) | truncate(155) }}"
        snow_description: |-
          Automated firmware remediation via Ansible (firmware-compliance).
          Scope: {{ _scope }}
          Reboot/activation requested: {{ reboot_after_upgrade }}
          Pre-change audit runs now; no device is touched until this change is
          CAB-approved and the job is re-run with -e snow_change_number=<this CHG>.
        _scope: "{{ ansible_limit | default(groups['all'] | difference(['localhost']) | join(', ')) }}"

    - name: Move the approved change to Implement
      when:
        - apply_updates | bool
        - cab_approved | default(false) | bool
      ansible.builtin.include_role:
        name: servicenow
      vars:
        snow_action: implement

    - name: Announce CAB status
      when: apply_updates | bool and require_change_ticket | bool
      ansible.builtin.debug:
        msg: >-
          {{ snow_change_number }} approval={{ cab_approval_state | default('requested') | upper }}
          state={{ snow_change_state | default('assess') | upper }}.
          {{ 'Cleared by CAB — devices inside the window will be remediated.' if cab_approved | default(false) | bool
             else ('Change is no longer open — open a new one (run without snow_change_number). AUDIT ONLY.'
                   if (snow_change_state | default('') | lower) in ['closed', 'canceled', 'review']
                   else 'NOT approved — this run is AUDIT ONLY. After CAB approval re-run with -e snow_change_number=' ~ snow_change_number) }}

    - name: Publish change identifiers to every device host
      when: snow_change_number | default('') | length > 0
      ansible.builtin.add_host:
        name: "{{ item }}"
        snow_change_sys_id: "{{ snow_change_sys_id }}"
        snow_change_number: "{{ snow_change_number }}"
        cab_approved: "{{ cab_approved | default(false) }}"
        cab_approval_state: "{{ cab_approval_state | default('requested') }}"
      loop: "{{ groups['all'] | difference(['localhost']) }}"
      changed_when: false

# ---------- Play 2: per-device audit + guarded remediation ----------
- name: Firmware compliance across all platforms
  hosts: all          # each host is dispatched by its platform group below
  gather_facts: false
  vars_files:
    - ../vars/golden_versions.yml
  vars:
    known_platforms: [ios, dnac, sdwan, panos, f5, iosxr, nxos, asa, aci, ise, ucs]
  tasks:
    - name: Audit / remediate this device
      block:
        - name: Resolve device credentials
          ansible.builtin.include_role:
            name: secret_server

        - name: Run preflight safety gate
          ansible.builtin.include_role:
            name: preflight

        - name: Dispatch platform role by group membership
          ansible.builtin.include_role:
            name: "{{ platform_role }}_firmware"
          loop: "{{ group_names | intersect(known_platforms) }}"
          loop_control:
            loop_var: platform_role

      rescue:
        - name: Record the failure so it shows in the report and the change
          ansible.builtin.set_fact:
            run_error: "{{ (ansible_failed_result.msg | default('task failed')) | string | truncate(300) }}"
            failed_task: "{{ ansible_failed_task.name | default('?') }}"
            platform_label: "{{ platform_label | default(group_names | intersect(known_platforms) | first | default('?')) }}"
            running_version: "{{ running_version | default('n/a') }}"
            compliant: false
            version_status: ERROR

    - name: Post this device's result to the change
      when: snow_change_sys_id is defined
      ansible.builtin.include_role:
        name: servicenow
      vars:
        snow_action: note
        snow_note: >-
          {{ inventory_hostname }} [{{ platform_label | default('?') }}]
          running={{ running_version | default('n/a') }} golden={{ target_version | default('n/a') }}
          status={{ version_status | default('n/a') }}
          {{ ('managed: ' ~ (managed_results | selectattr('compliant') | list | length) ~ '/' ~ (managed_results | length) ~ ' compliant') if managed_results is defined else '' }}
          {{ ('action: ' ~ upgrade_action) if upgrade_action is defined else '' }}
          {{ ('ERROR in "' ~ failed_task ~ '": ' ~ run_error) if run_error is defined else '' }}

# ---------- Play 3: report + close the change ----------
- name: Build compliance report and close change
  hosts: localhost
  gather_facts: false
  vars_files:
    - ../vars/golden_versions.yml
  tasks:
    - name: Generate compliance report
      ansible.builtin.include_role:
        name: compliance_report

    - name: Attach report to the change
      when: snow_change_sys_id is defined
      ansible.builtin.include_role:
        name: servicenow
      vars:
        snow_action: attach
        snow_attachments:
          - path: "{{ report_json_path }}"
          - path: "{{ report_html_path }}"

    - name: Close the change (something was applied)
      when:
        - snow_change_sys_id is defined
        - cab_approved | default(false) | bool
        - report_summary.applied_hosts | length > 0
      ansible.builtin.include_role:
        name: servicenow
      vars:
        snow_action: close
        snow_close_code: >-
          {{ 'unsuccessful' if report_summary.errors | length == report_summary.applied_hosts | length
             else ('successful_issues' if report_summary.errors | length > 0 else 'successful') }}
        snow_close_notes: >-
          Ansible firmware remediation complete. Applied on: {{ report_summary.applied_hosts | join(', ') }}.
          Compliant {{ report_summary.compliant }}/{{ report_summary.total }}.
          Errors: {{ report_summary.errors | join(', ') if report_summary.errors else 'none' }}.
          Report attached.

    - name: Leave the change open with a note (nothing applied)
      when:
        - snow_change_sys_id is defined
        - report_summary.applied_hosts | length == 0
      ansible.builtin.include_role:
        name: servicenow
      vars:
        snow_action: note
        snow_note: >-
          Pre-change audit complete — no device was modified
          ({{ 'CAB approval pending' if not (cab_approved | default(false) | bool) else 'outside the maintenance window or nothing to remediate' }}).
          Compliant {{ report_summary.compliant }}/{{ report_summary.total }}. Report attached.
